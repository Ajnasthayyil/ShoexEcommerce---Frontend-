<!-- Floating Chatbot Widget Container -->
<div class="fixed bottom-6 right-6 z-50 flex flex-col items-end font-sans">
  
  <!-- Chat Window -->
  <div *ngIf="isOpen" 
       class="w-96 max-w-[calc(100vw-2rem)] h-[520px] max-h-[80vh] flex flex-col bg-white rounded-[2rem] shadow-[0_12px_40px_rgba(0,0,0,0.12)] border border-gray-100 overflow-hidden mb-4 transition-all duration-300 animate-slideUp">
    
    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 bg-gradient-to-r from-red-600 to-orange-500 text-white shadow-sm">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-md">
          <i class="fa-solid fa-robot text-sm"></i>
        </div>
        <div>
          <h3 class="text-sm font-black uppercase tracking-wider leading-none">ShoeX AI</h3>
          <span class="text-[9px] text-white/80 font-bold uppercase tracking-widest mt-0.5 block">Always active</span>
        </div>
      </div>
      <button (click)="toggleChat()" class="text-white/80 hover:text-white transition-colors p-1">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>

    <!-- Suggested Quick Navigation -->
    <div class="flex justify-between px-6 py-3 bg-gray-50/50 border-b border-gray-100/50">
      <button (click)="sendMessage('Show products')" 
              class="px-2.5 py-1.5 bg-white border border-gray-150 rounded-full text-[10px] font-black text-gray-500 hover:border-red-500 hover:text-red-500 transition-all shadow-sm flex items-center gap-1">
        <i class="fa-solid fa-shoe-prints text-red-500/80"></i> Catalog
      </button>
      <button (click)="sendMessage('Go to cart')" 
              class="px-2.5 py-1.5 bg-white border border-gray-150 rounded-full text-[10px] font-black text-gray-500 hover:border-red-500 hover:text-red-500 transition-all shadow-sm flex items-center gap-1">
        <i class="fa-solid fa-cart-shopping text-red-500/80"></i> My Cart
      </button>
      <button (click)="sendMessage('Go to wishlist')" 
              class="px-2.5 py-1.5 bg-white border border-gray-150 rounded-full text-[10px] font-black text-gray-500 hover:border-red-500 hover:text-red-500 transition-all shadow-sm flex items-center gap-1">
        <i class="fa-solid fa-heart text-red-500/80"></i> Wishlist
      </button>
      <button (click)="sendMessage('Go to orders')" 
              class="px-2.5 py-1.5 bg-white border border-gray-150 rounded-full text-[10px] font-black text-gray-500 hover:border-red-500 hover:text-red-500 transition-all shadow-sm flex items-center gap-1">
        <i class="fa-solid fa-box text-red-500/80"></i> Orders
      </button>
    </div>

    <!-- Chat Messages -->
    <div #chatContainer class="flex-1 overflow-y-auto px-6 py-4 space-y-4 bg-gray-50/30 custom-scrollbar">
      <ng-container *ngFor="let msg of messages">
        <div [ngClass]="{
          'flex justify-end': msg.sender === 'user',
          'flex justify-start': msg.sender === 'bot'
        }">
          <div class="max-w-[80%] px-4 py-3 rounded-2xl shadow-sm border"
               [ngClass]="{
                 'bg-gray-900 text-white border-gray-900 rounded-tr-none': msg.sender === 'user',
                 'bg-white text-gray-800 border-gray-100 rounded-tl-none': msg.sender === 'bot'
               }">
            <p class="text-[13px] font-medium leading-relaxed break-words">{{ msg.content }}</p>
            
            <!-- Recommended Product Cards -->
            <div *ngIf="msg.recommendedProducts && msg.recommendedProducts.length > 0" 
                 class="mt-3 flex gap-2 overflow-x-auto pb-2 max-w-full custom-scrollbar">
              <div *ngFor="let prod of msg.recommendedProducts" 
                   (click)="navigateToProduct(prod.id)"
                   class="flex-shrink-0 w-28 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded-xl p-2 cursor-pointer transition duration-300">
                <img [src]="prod.imageUrl" class="w-full h-14 object-cover rounded-lg mb-1.5" />
                <h4 class="text-[9px] font-black text-gray-800 truncate">{{ prod.name }}</h4>
                <div class="flex items-center justify-between mt-1">
                  <span class="text-[9px] font-black text-gray-900">₹{{ prod.price }}</span>
                  <span class="text-[8px] font-black text-red-600 uppercase tracking-widest">View →</span>
                </div>
              </div>
              <!-- Dummy spacer to preserve right padding on scroll -->
              <div class="w-4 flex-shrink-0"></div>
            </div>

            <span class="text-[9px] text-gray-400 font-bold uppercase tracking-widest mt-1.5 block" *ngIf="msg.timestamp">
              {{ msg.timestamp | date:'shortTime' }}
            </span>
          </div>
        </div>
      </ng-container>

      <!-- Thinking Indicator -->
      <div *ngIf="loading" class="flex justify-start">
        <div class="flex items-center gap-2 px-4 py-3 bg-white border border-gray-100 rounded-2xl rounded-tl-none shadow-sm">
          <div class="flex gap-1">
            <span class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></span>
            <span class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></span>
            <span class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.3s"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="p-4 bg-white border-t border-gray-100 flex items-center gap-3">
      <input [(ngModel)]="userInput"
             (keydown.enter)="onEnter($event)"
             type="text"
             placeholder="Ask or command (e.g., 'go to cart')..."
             class="flex-1 px-4 py-3 bg-gray-50 border-0 rounded-2xl text-xs font-semibold placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:bg-white transition" />
      <button (click)="sendMessage()"
              class="w-10 h-10 rounded-2xl bg-gray-900 hover:bg-red-600 text-white flex items-center justify-center shadow-lg transition duration-300 hover:scale-105 active:scale-95">
        <i class="fa-solid fa-arrow-up text-sm"></i>
      </button>
    </div>

  </div>

  <!-- Floating Toggle Button -->
  <button (click)="toggleChat()" 
          class="w-14 h-14 rounded-full bg-gradient-to-r from-red-600 to-orange-500 text-white flex items-center justify-center shadow-2xl transition duration-300 hover:scale-110 active:scale-90 hover:rotate-6 z-50">
    <i class="fa-solid text-xl" [class.fa-robot]="!isOpen" [class.fa-xmark]="isOpen"></i>
  </button>

</div>
